# https://taskfile.dev
version: "3"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install JavaScript dependencies
    method: timestamp
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install

  dev:
    desc: Run the desktop app in development mode
    deps: [install]
    cmds:
      - pnpm tauri dev {{.CLI_ARGS}}

  dev:mock:
    desc: Run the desktop app with simulated hands and images, no device needed
    deps: [install]
    env:
      MAREY_MOCK: "1"
    cmds:
      - pnpm tauri dev {{.CLI_ARGS}}

  dev:web:
    desc: Run only the frontend dev server, without the desktop shell
    deps: [install]
    cmds:
      - pnpm dev

  build:
    desc: Build the release app and installers
    deps: [install]
    cmds:
      - pnpm tauri build {{.CLI_ARGS}}

  build:debug:
    desc: Build the app with debug symbols and devtools
    deps: [install]
    cmds:
      - pnpm tauri build --debug {{.CLI_ARGS}}

  build:web:
    desc: Type-check and build only the frontend
    deps: [install]
    cmds:
      - pnpm build

  typecheck:
    desc: Type-check the frontend
    deps: [install]
    cmds:
      - pnpm exec tsc --noEmit

  cargo:check:
    desc: Compile-check the Rust workspace
    cmds:
      - cargo check --workspace

  lint:
    desc: Lint Rust with Clippy (warnings are errors) and the frontend with ESLint
    deps: [install]
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      - pnpm lint

  fmt:
    desc: Format Rust and the frontend
    deps: [install]
    cmds:
      - cargo fmt --all
      - pnpm format

  fmt:check:
    desc: Verify Rust and frontend formatting
    deps: [install]
    cmds:
      - cargo fmt --all --check
      - pnpm format:check

  test:
    desc: Run the Rust tests, which need no device
    cmds:
      - cargo test --workspace

  types:
    desc: Regenerate the TypeScript types from the Rust DTOs
    cmds:
      - cargo test -p marey export_bindings

  check:
    desc: Run all static checks and tests
    cmds:
      - task: typecheck
      - task: fmt:check
      - task: lint
      - task: test

  info:
    desc: Show Tauri environment and dependency information
    deps: [install]
    cmds:
      - pnpm tauri info

  icon:
    desc: "Generate app icons from a source image (usage: task icon -- path/to/icon.png)"
    deps: [install]
    cmds:
      - pnpm tauri icon {{.CLI_ARGS}}

  update:
    desc: Update JavaScript and Rust dependencies within their allowed ranges
    cmds:
      - pnpm update
      - cargo update

  clean:
    desc: Remove build output (frontend bundle and Rust target directory)
    cmds:
      - rm -rf dist
      - cargo clean
